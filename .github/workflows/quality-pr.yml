# Runs cqs on the files changed in a pull request and posts an inline review.
name: Quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # required to post the review

jobs:
  quality-gate:
    name: cqs PR review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cqs
        run: npm install -g cqs-audit

      # repo, PR number and token are read from the Actions environment.
      # Exits non-zero when the score is below --threshold, failing the job.
      - name: PR review
        run: cqs pr-review --stack playwright --threshold 80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Full report artifact
        if: always()
        run: cqs ./functional-tests --stack playwright --output json > cqs-report.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cqs-report
          path: cqs-report.json
          retention-days: 30
